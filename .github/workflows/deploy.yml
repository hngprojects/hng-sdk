name: Monorepo Package Deploy CD

on:
  push:
    branches: ['dev']
    paths:
      - 'src/packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: write
  packages: write

jobs:
  detect_and_bump_versions:
    name: Detect Changed Packages & Bump Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.output_matrix.outputs.matrix }}
      has_changes: ${{ steps.output_matrix.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Detect changed package directories
        id: detect
        run: |
          echo "Detecting changed packages since last commit..."
          git fetch --no-tags --prune --depth=2 origin dev

          CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^src/packages/' | cut -d'/' -f1-3 | sort -u)
          echo "Changed packages:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "No packages changed."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"package\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          PACKAGES=$(echo "$CHANGED" | jq -R . | jq -cs .)
          MATRIX_JSON=$(jq -nc --argjson pkgs "$PACKAGES" '{"package": $pkgs}')

          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Bump versions sequentially
        if: env.CHANGED != ''
        run: |
          parse_version() {
            IFS='.' read -r major minor patch <<< "$1"
            [ -z "$major" ] && major=0 && minor=0 && patch=0
            if [ "$patch" -lt 90 ]; then patch=$((patch+1))
            else patch=0 && if [ "$minor" -lt 90 ]; then minor=$((minor+1)); else minor=0 && major=$((major+1)); fi
            fi
            echo "$major.$minor.$patch"
          }

          for pkg in $CHANGED; do
            echo "Processing $pkg..."
            cd "$pkg"
            PKG_NAME=$(jq -r .name package.json)
            CURRENT_VERSION=$(jq -r .version package.json)
            PUBLISHED_VERSION=$(npm view "$PKG_NAME" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "0.0.0")

            if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
              NEW_VERSION=$(parse_version "$PUBLISHED_VERSION")
              jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
              echo "Bumped $PKG_NAME to $NEW_VERSION"
            else
              echo "$PKG_NAME is already ahead ($CURRENT_VERSION vs $PUBLISHED_VERSION)"
            fi

            cd - >/dev/null
          done

      - name: Commit and push version bumps
        if: env.CHANGED != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config core.hooksPath /dev/null
          git add src/packages/*/package.json
          git commit -m "chore: bump versions for updated packages" || echo "No changes to commit"
          git pull --rebase origin dev || echo "No rebase needed"
          git push origin dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare matrix output
        id: output_matrix
        run: |
          PACKAGES=$(echo "$CHANGED" | jq -R . | jq -cs .)
          MATRIX_JSON=$(jq -nc --argjson pkgs "$PACKAGES" '{"package": $pkgs}')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

  publish_packages:
    name: Publish Packages
    needs: detect_and_bump_versions
    if: needs.detect_and_bump_versions.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect_and_bump_versions.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hng-sdk'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        working-directory: ${{ matrix.package }}
        run: pnpm run build

      - name: Publish to GitHub Packages
        working-directory: ${{ matrix.package }}
        run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
